<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Issa Aziz KARAMBIRI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06080D">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
<style>
:root{--bg:#06080D;--ink:#EEF1F6;--muted:#8892A6;--line:#2A3446;--gold:#F2B84B}
@media (prefers-color-scheme:light){:root{--bg:#F4F6F9;--ink:#0D1320;--muted:#566074;--line:#C9D0DB;--gold:#A86E00}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;text-align:center}
.code{font:900 clamp(5rem,22vw,9rem)/1 "Arial Black",system-ui,sans-serif;color:var(--gold);letter-spacing:-.04em}
h1{font-size:1.4rem;margin:16px 0 8px}
p{color:var(--muted);margin:0 0 28px;max-width:420px}
a{display:inline-block;padding:12px 22px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
a:hover,a:focus-visible{border-color:var(--gold);outline:none}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1 id="t">Cette page n'existe pas</h1>
  <p id="d">Le lien est peut-être incorrect ou la page a été déplacée.</p>
  <a id="b" href="/">Retour au portfolio</a>
</main>
<script>
try{var L=localStorage.getItem("iak-lang");if(L!=="fr"&&L!=="en")L=/^fr/i.test(navigator.language||"fr")?"fr":"en";if(L==="en"){document.documentElement.lang="en";document.title="Page not found · Issa Aziz KARAMBIRI";t.textContent="This page does not exist";d.textContent="The link may be wrong or the page has moved.";b.textContent="Back to the portfolio";}}catch(e){}
</script>
</body>
</html>
